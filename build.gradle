plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.147' apply(false)
}

base {
	archivesName = archives_base_name
}

allprojects {
	apply plugin: 'java-library'

	version = "${project.mod_version}"
	group = project.maven_group

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}
}

subprojects {
	base {
		archivesName = rootProject.base.archivesName.get() + (project.name != "common" ? "-" + project.name : "")
	}

	repositories {
		mavenCentral()
		maven { url = "https://maven.neoforged.net/releases/" }
		// FTB Library / FTB Teams 26.2 are not on maven.ftb.dev yet: use the jars from the modpack (see libs/README.md)
		flatDir { dirs rootProject.file("libs") }
	}

	dependencies {
		compileOnly files(rootProject.file("libs/ftb-library-neoforge-${rootProject.ftb_library_version}.jar"))
		compileOnly files(rootProject.file("libs/ftb-teams-neoforge-${rootProject.ftb_teams_version}.jar"))
		compileOnly "de.marhali:json5-java:3.0.0"
	}

	if (project.name != "common") {
		dependencies {
			compileOnly project(":common")
		}

		jar {
			from project(":common").sourceSets.main.output
		}
	}

	processResources {
		exclude '.cache'

		inputs.property "version", project.version

		filesMatching(["META-INF/neoforge.mods.toml"]) {
			expand "version": project.version,
					"neoforgeversionrange": project.neoforge_version_range,
					"neoforgeloaderversion": project.neoforge_loader_version,
					"minecraft_version_range_maven": minecraft_version_range_maven,
					"ftblibraryversion": project.ftb_library_version,
					"ftbteamsversion": project.ftb_teams_version
		}
	}
}
