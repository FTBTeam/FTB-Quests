plugins {
	id 'net.neoforged.moddev'
}

neoForge {
	version = project.neoforge_version
//    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
			sourceSet(sourceSets.test)
			sourceSet(project(":common").sourceSets.main)
		}
	}

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			loadedMods = [ mods.getByName(project.mod_id) ]
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
			gameDirectory = project.file('run-gametest')
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}
}

sourceSets {
	test {
		compileClasspath += main.output + main.compileClasspath
		runtimeClasspath += main.output + main.runtimeClasspath
	}
}

tasks.named('test') { enabled = false }

tasks.named('check') {
	dependsOn 'runGameTestServer'
}

configurations {
	runGameTestServerAdditionalRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
	runGameTestServerAdditionalRuntimeClasspath files(sourceSets.test.output)
}

repositories {
	maven {
		url "https://maven.neoforged.net/releases/"
	}
}

dependencies {
	implementation("dev.ftb.mods:ftb-library-neoforge:${rootProject.ftb_library_version}")
	implementation("dev.ftb.mods:ftb-teams-neoforge:${rootProject.ftb_teams_version}")
}

jar {
	manifest {
		attributes([
				"Specification-Title"     : project.mod_id,
				"Specification-Vendor"    : project.mod_author,
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : version,
				"Implementation-Vendor"   : project.mod_author,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}
